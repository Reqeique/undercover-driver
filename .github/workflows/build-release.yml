name: Build native release

# Builds native CLI binaries (pyinstaller --onefile) for Windows, Linux and
# macOS and attaches them to a public GitHub release.  Run manually; the
# binaries are then installable anonymously via the one-liners in the README.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.1.0 (uses the tag in the YAML default if blank)'
        required: false
        type: string
      tag:
        description: 'Tag to push + release against (default: v0.1.0)'
        required: false
        default: 'v0.1.0'
        type: string
      draft:
        description: 'Create as a draft release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            os: windows-latest
            asset: undercover-driver-windows-amd64.exe
          - target: linux-amd64
            os: ubuntu-latest
            asset: undercover-driver-linux-amd64
          - target: darwin-arm64
            os: macos-14
            asset: undercover-driver-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyinstaller
        run: python -m pip install --quiet pyinstaller

      - name: Build onefile binary
        run: python -m PyInstaller --onefile --name undercover-driver --distpath dist --workpath build src/cli.py

      - name: Sanity check
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./dist/undercover-driver.exe --help >/dev/null && echo "binary OK"
          else
            ./dist/undercover-driver --help >/dev/null && echo "binary OK"
          fi

      - name: Rename binary to platform asset name
        shell: bash
        run: |
          cp "dist/undercover-driver" "dist/${{ matrix.asset }}" 2>/dev/null \
            || cp "dist/undercover-driver.exe" "dist/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute release tag
        id: tag
        run: |
          echo "tag=${{ inputs.tag || 'v0.1.0' }}" >> "$GITHUB_OUTPUT"

      - name: Push tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          git config --global user.name "release-bot"
          git config --global user.email "automation@users.noreply.github.com"
          if ! git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create / update release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ls -la release-assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --draft=${{ inputs.draft || false }}
            echo "updated existing release $TAG"
          else
            gh release create "$TAG" release-assets/* \
              --title "$TAG — undercover-driver (undercover-driver)" \
              --notes "Native binaries for Windows/Linux/macOS. Install anonymously:\n\n  curl -fsSL https://raw.githubusercontent.com/Reqeique/undercover-driver/main/install.sh | sh" \
              --draft=${{ inputs.draft || false }}
            echo "created release $TAG"
          fi
          gh release view "$TAG" --json url -q .url
